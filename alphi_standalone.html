<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Danit Avatar — Based on VU-VRM</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #1a1a2e; overflow: hidden; }
    canvas { display: block; }
    #ui {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); padding: 10px 24px; border-radius: 25px;
      border: 1px solid #333; z-index: 10;
    }
    #ui button {
      background: #0f3460; color: #ccc; border: 1px solid #4fc3f7;
      padding: 10px 30px; border-radius: 20px; cursor: pointer; font-size: 15px;
    }
  </style>
</head>
<body>

<!-- EXACT same libraries as VU-VRM (proven working) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.110.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r110/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r110/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/@pixiv/three-vrm@0.3.0/lib/three-vrm.js"></script>

<div id="ui">
  <button onclick="startAudio()">Click to Start Speaking</button>
</div>

<script>
// ==========================================================
// SETUP — copied from VU-VRM (working code)
// ==========================================================

var mouththreshold = 10;
var mouthboost = 15;

// renderer
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// camera — zoomed into face
const camera = new THREE.PerspectiveCamera(30.0, window.innerWidth / window.innerHeight, 0.1, 20.0);
camera.position.set(0.0, 1.45, 0.75);

// controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.screenSpacePanning = true;
controls.target.set(0.0, 1.45, 0.0);
controls.update();

// scene
const scene = new THREE.Scene();

// light
const light = new THREE.DirectionalLight(0xffffff);
light.position.set(1.0, 1.0, 1.0).normalize();
scene.add(light);

// lookat target
const lookAtTarget = new THREE.Object3D();
camera.add(lookAtTarget);

// ==========================================================
// LOAD VRM — copied from VU-VRM
// ==========================================================
let currentVrm = undefined;
const loader = new THREE.GLTFLoader();

function load(url) {
  loader.crossOrigin = 'anonymous';
  loader.load(url, (gltf) => {
    THREE.VRMUtils.removeUnnecessaryJoints(gltf.scene);
    THREE.VRM.from(gltf).then((vrm) => {
      if (currentVrm) {
        scene.remove(currentVrm.scene);
        currentVrm.dispose();
      }
      currentVrm = vrm;
      scene.add(vrm.scene);

      vrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName.Hips).rotation.y = Math.PI;
      vrm.springBoneManager.reset();

      // un-T-pose
      vrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName.RightUpperArm).rotation.z = 250;
      vrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName.RightLowerArm).rotation.z = -0.2;
      vrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName.LeftUpperArm).rotation.z = -250;
      vrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName.LeftLowerArm).rotation.z = 0.2;

      vrm.lookAt.target = lookAtTarget;
      vrm.springBoneManager.reset();

      console.log('VRM loaded', vrm);
    });
  },
  (progress) => console.log('Loading...', 100.0 * (progress.loaded / progress.total), '%'),
  (error) => console.error(error)
  );
}

// Load THEIR model (proven to work with VRM 0.x API)
load('assets/VU-VRM-elf.vrm');

// ==========================================================
// ANIMATE — copied from VU-VRM
// ==========================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const deltaTime = clock.getDelta();
  if (currentVrm) {
    currentVrm.update(deltaTime);
  }
  renderer.render(scene, camera);
}
animate();

// ==========================================================
// AUDIO — changed from mic to audio file playback
// ==========================================================
var audioContext;
var analyser;
var isPlaying = false;

function startAudio() {
  if (isPlaying) return;

  audioContext = new AudioContext();
  analyser = audioContext.createAnalyser();
  analyser.smoothingTimeConstant = 0.5;
  analyser.fftSize = 1024;

  // Fetch and decode audio (ChatVRM approach — proven)
  fetch('assets/audio.mp3')
    .then(response => response.arrayBuffer())
    .then(buffer => audioContext.decodeAudioData(buffer))
    .then(audioBuffer => {
      const source = audioContext.createBufferSource();
      source.buffer = audioBuffer;
      // Connect: source -> analyser -> destination (so we both hear AND analyze)
      source.connect(analyser);
      analyser.connect(audioContext.destination);
      source.start();
      isPlaying = true;

      source.addEventListener('ended', () => {
        isPlaying = false;
      });

      // Start the lip sync loop
      lipSyncLoop();
    })
    .catch(err => console.error('Audio error:', err));
}

// ==========================================================
// LIP SYNC LOOP — adapted from VU-VRM's onaudioprocess
// Uses THEIR exact lip sync code
// ==========================================================
function lipSyncLoop() {
  if (!isPlaying || !currentVrm) {
    if (isPlaying) requestAnimationFrame(lipSyncLoop);
    return;
  }

  var array = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(array);
  var values = 0;
  var length = array.length;
  for (var i = 0; i < length; i++) {
    values += array[i];
  }
  var average = values / length;
  var inputvolume = average;

  // THEIR exact mouth code
  var voweldamp = 53;
  var vowelmin = 12;
  if (inputvolume > (mouththreshold * 2)) {
    currentVrm.blendShapeProxy.setValue(
      THREE.VRMSchema.BlendShapePresetName.A,
      ((average - vowelmin) / voweldamp) * (mouthboost / 10)
    );
  } else {
    currentVrm.blendShapeProxy.setValue(
      THREE.VRMSchema.BlendShapePresetName.A, 0
    );
  }

  requestAnimationFrame(lipSyncLoop);
}

// ==========================================================
// BLINK — copied from VU-VRM
// ==========================================================
function blink() {
  if (!currentVrm) return;
  var blinktimeout = Math.floor(Math.random() * 250) + 50;

  setTimeout(() => {
    if (!currentVrm) return;
    currentVrm.blendShapeProxy.setValue(THREE.VRMSchema.BlendShapePresetName.BlinkL, 0);
    currentVrm.blendShapeProxy.setValue(THREE.VRMSchema.BlendShapePresetName.BlinkR, 0);
  }, blinktimeout);

  currentVrm.blendShapeProxy.setValue(THREE.VRMSchema.BlendShapePresetName.BlinkL, 1);
  currentVrm.blendShapeProxy.setValue(THREE.VRMSchema.BlendShapePresetName.BlinkR, 1);
}

(function loop() {
  var rand = Math.round(Math.random() * 10000) + 1000;
  setTimeout(function () {
    blink();
    loop();
  }, rand);
})();

// ==========================================================
// RESIZE
// ==========================================================
window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
